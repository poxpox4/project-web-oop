version: '3.8'
services:
  mysql:
    image: mysql:8
    container_name: numer_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: numernaja
      MYSQL_DATABASE: numer
      MYSQL_USER: user
      MYSQL_PASSWORD: numerja
    ports:
      - "3307:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./mysql_init:/docker-entrypoint-initdb.d

  phpmyadmin:  # (ออปชัน) UI จัดการ DB
    image: phpmyadmin:latest
    restart: always
    depends_on: [mysql]
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: numer_backend_p
    depends_on: [mysql]

    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend: 
    build: ./frontend
    container_name: numer_frontend_p
    depends_on:
      - backend
    ports:
      - "5173:5173"